# /etc/nginx/sites-available/hbtraders.com
#
# Install:
#   sudo cp deploy/nginx_hbtraders.com.conf /etc/nginx/sites-available/hbtraders.com
#   sudo ln -s /etc/nginx/sites-available/hbtraders.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: Run this file through Certbot first (see DEPLOY.md step 8) —
# `certbot --nginx` will edit this file in place to add the SSL server
# block and the 443 cert/key paths automatically. The commented-out SSL
# lines below show what Certbot will add, in case you prefer to run it
# manually / know what to expect.

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name hbtraders.com www.hbtraders.com;

    # Let's Encrypt HTTP-01 challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real site ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hbtraders.com www.hbtraders.com;

    # --- SSL certs (Certbot fills these in automatically) ---
    # ssl_certificate     /etc/letsencrypt/live/hbtraders.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hbtraders.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    access_log /var/log/nginx/hbtraders.access.log;
    error_log  /var/log/nginx/hbtraders.error.log;

    # --- Static files: served directly by Nginx, never touches Django ---
    location /static/ {
        alias /home/hbtrader/hbtrader/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Media files: uploaded product images ---
    location /media/ {
        alias /home/hbtrader/hbtrader/media/;
        expires 7d;
    }

    # --- Everything else: proxy to Gunicorn over the Unix socket ---
    location / {
        proxy_pass http://unix:/run/hbtrader/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
