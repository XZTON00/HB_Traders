<footer>
  <div class="wrap footer__inner">
    <p class="footer__thanks">Thank you for your <span>business.</span></p>
    <div class="footer__grid">
      <div class="footer__block"><p class="footer__label">Company</p><p class="footer__value">{{ business.company_name }}</p></div>
      <div class="footer__block"><p class="footer__label">Category</p><p class="footer__value">{{ business.subtitle }}</p></div>
      <div class="footer__block"><p class="footer__label">Phone</p><p class="footer__value">{{ business.phone }}</p></div>
      <div class="footer__block"><p class="footer__label">Email</p><p class="footer__value">{{ business.email }}</p></div>
    </div>
    <div class="footer__bottom">
      <span>{{ business.address }}</span>
      <span>Catalog printed for internal &amp; retail distribution use</span>
    </div>
  </div>
</footer>
